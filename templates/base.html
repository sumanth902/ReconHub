<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReconHub</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS Files -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/cards.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/navbar.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/results.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/search.css') }}"
    >

</head>

<body>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <!-- ========================= -->
    <!-- Navigation Bar -->
    <!-- ========================= -->

    <nav class="navbar">

        <div class="logo">
            ReconHub
        </div>

        <ul class="nav-links">

            <!-- Always visible -->
            <li>
                <a href="/">
                    Home
                </a>
            </li>

            <li>
                <a href="/history">
                    History
                </a>
            </li>


            <!-- ========================= -->
            <!-- Logged-in User -->
            <!-- ========================= -->

            {% if session.get("user_id") %}

                <li>
                    <a href="{{ url_for('github_page') }}">
                        GitHub
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('documentation_page') }}">
                        Documentation
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('logout.logout') }}">
                        Logout
                    </a>
                </li>


            <!-- ========================= -->
            <!-- Logged-out User -->
            <!-- ========================= -->

            {% else %}

                <li>
                    <a href="{{ url_for('login.login') }}">
                        Login
                    </a>
                </li>

                <li>
                    <a href="{{ url_for('register.register') }}">
                        Register
                    </a>
                </li>

            {% endif %}

        </ul>

    </nav>


    <!-- ========================= -->
    <!-- Main Page Content -->
    <!-- ========================= -->

    {% block content %}
    {% endblock %}


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- ReconHub JavaScript -->
    <script
        src="{{ url_for('static', filename='js/app.js') }}">
    </script>


    <!-- Loading Animation -->
    <script>

        const reconForm = document.querySelector("form");

        if (reconForm) {

            reconForm.addEventListener("submit", function () {

                const loading = document.getElementById("loading");

                if (loading) {
                    loading.style.display = "flex";
                }

            });

        }

    </script>

</body>

</html>
